<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Pips Helper</h1>
        <span id="status" class="status-badge">Ready</span>
      </header>

      <div class="button-row">
        <button id="readButton">Read puzzle</button>
        <button id="solveButton" disabled>Solve</button>
        <button id="fillAllButton" disabled>Fill all</button>
        <button id="testButton">Test puzzles</button>
      </div>

      <div id="test-section" class="panel hidden">
        <div class="panel-label">Test results</div>
        <div id="test-progress" class="test-progress hidden" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="test-progress-fill" class="test-progress-fill"></div>
        </div>
        <div id="test-failures" class="test-failures hidden"></div>
        <div id="test-results"></div>
      </div>

      <div id="board-section" class="panel hidden">
        <div class="panel-label">Board</div>
        <div id="board"></div>
      </div>
    </main>

    <script src="pipsSolver.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
